<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuiz Unit 7.1 - Pengenalan Kecederaan Sukan</title>
<style>
:root{--red:#b91c1c;--blue:#1d4ed8;--ink:#172033;--muted:#64748b;--line:#dbe3ef;--bg:#f3f6fb}*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink);line-height:1.5}
header{background:linear-gradient(120deg,#991b1b,#1d4ed8);color:white;padding:28px 16px;text-align:center}header h1{margin:0;font-size:clamp(22px,4vw,32px)}header p{margin:7px 0 0}
main{max-width:900px;margin:22px auto;padding:0 14px}.panel,.question,.result{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px #0f172a0b}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}.bar{height:9px;background:#e5eaf2;border-radius:20px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--blue));width:0}
h2{font-size:19px;margin:12px 0}.option{display:block;border:1px solid var(--line);border-radius:10px;padding:12px;margin:9px 0;cursor:pointer}.option:hover{border-color:var(--blue);background:#eff6ff}.option input{margin-right:9px;accent-color:var(--blue)}.option.correct{border-color:#15803d;background:#f0fdf4}.option.wrong{border-color:#dc2626;background:#fef2f2}
.feedback{display:none;padding:12px;border-radius:10px;margin-top:12px}.feedback.show{display:block}.good{background:#ecfdf5;color:#166534}.bad{background:#fef2f2;color:#991b1b}
button{border:0;border-radius:10px;padding:12px 18px;font-weight:bold;cursor:pointer;margin:5px 5px 0 0;background:var(--blue);color:white}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#991b1b}.hidden{display:none}.score{font-size:42px;font-weight:800;color:var(--blue)}.small{color:var(--muted);font-size:13px}.review-item{padding:12px 0;border-bottom:1px solid var(--line)}footer{text-align:center;color:var(--muted);padding:20px;font-size:13px}
</style></head><body><header><h1>Kuiz Interaktif Sains Sukan Tingkatan 5</h1><p>Unit 7.1: Pengenalan Kecederaan Sukan</p></header>
<main><section class="panel"><div class="meta"><span id="counter">Soalan 1 daripada 33</span><span id="progressText">0% selesai</span></div><div class="bar"><span id="progress"></span></div><p class="small">Pilih satu jawapan yang paling tepat. Maklum balas dan penerangan diberikan selepas setiap jawapan.</p></section><div id="quiz"></div><section id="result" class="result hidden"></section></main>
<footer>Disediakan oleh : Cikgu Zulfadhli bin Ateman</footer>
<script>
const questions = [{"q": "Apakah yang dimaksudkan dengan kecederaan sukan?", "o": ["Kerosakan atau gangguan pada struktur atau fungsi tubuh akibat aktiviti sukan", "Peningkatan kecergasan hasil latihan", "Keletihan biasa selepas melakukan aktiviti fizikal", "Penurunan motivasi sebelum pertandingan"], "a": 0, "e": "Kecederaan sukan merujuk kepada gangguan atau kerosakan yang berlaku pada tubuh ketika melakukan aktiviti sukan."}, {"q": "Kecederaan sukan boleh diklasifikasikan kepada", "o": ["kecederaan akut dan kronik", "kecederaan dalaman dan luaran sahaja", "kecederaan ringan dan sederhana sahaja", "kecederaan fizikal dan mental"], "a": 0, "e": "Dalam bahan rujukan, kecederaan sukan dibahagikan kepada kecederaan akut dan kronik."}, {"q": "Apakah ciri utama kecederaan akut?", "o": ["Berlaku secara tiba-tiba", "Berlaku secara perlahan-lahan dalam tempoh panjang", "Disebabkan aktiviti berulang kali sahaja", "Tidak melibatkan kesakitan"], "a": 0, "e": "Kecederaan akut biasanya berlaku secara tiba-tiba, contohnya akibat hentakan atau pergerakan yang salah."}, {"q": "Antara berikut, yang manakah contoh kecederaan akut?", "o": ["Terseliuh lutut ketika mendarat", "Tennis elbow", "Shin splints akibat latihan berulang", "Stress fracture akibat beban berulang"], "a": 0, "e": "Terseliuh lutut ketika mendarat ialah contoh kecederaan yang berlaku secara tiba-tiba."}, {"q": "Apakah ciri kecederaan kronik?", "o": ["Terjadi secara beransur-ansur akibat tekanan atau aktiviti berulang", "Berlaku serta-merta akibat satu hentakan", "Hanya berlaku ketika pertandingan akhir", "Tidak berkaitan dengan aktiviti fizikal"], "a": 0, "e": "Kecederaan kronik berkembang secara beransur-ansur, lazimnya akibat penggunaan atau tekanan berulang."}, {"q": "Tennis elbow biasanya dikategorikan sebagai", "o": ["kecederaan kronik", "kecederaan akut", "kecederaan akibat strok haba", "kecederaan luka tusukan"], "a": 0, "e": "Tennis elbow disenaraikan sebagai contoh kecederaan kronik dalam bahan rujukan."}, {"q": "Antara berikut, yang manakah contoh kecederaan kronik?", "o": ["Shin splints", "Luka potongan", "Patah akibat hentakan kuat", "Terseliuh secara tiba-tiba"], "a": 0, "e": "Shin splints dikaitkan dengan tekanan atau aktiviti berulang dan dikategorikan sebagai kecederaan kronik."}, {"q": "Kecederaan akut boleh berlaku akibat", "o": ["hentakan kuat ke atas tisu lembut", "latihan berulang dalam tempoh panjang sahaja", "kurang motivasi", "kurang tumpuan ketika belajar"], "a": 0, "e": "Hentakan kuat ke atas tisu lembut merupakan antara punca kecederaan akut."}, {"q": "Apakah perbezaan utama antara kecederaan akut dengan kecederaan kronik?", "o": ["Akut berlaku tiba-tiba, kronik berkembang beransur-ansur", "Akut berlaku beransur-ansur, kronik berlaku tiba-tiba", "Kedua-duanya hanya berlaku pada tulang", "Kedua-duanya tidak menyebabkan kesakitan"], "a": 0, "e": "Perbezaan utama ialah cara dan tempoh kecederaan berlaku."}, {"q": "Seorang pemain bola tampar mengalami kecederaan buku lali selepas mendarat dengan posisi kaki yang salah. Kecederaan ini paling sesuai dikategorikan sebagai", "o": ["akut", "kronik", "stres haba", "kecederaan akibat dehidrasi"], "a": 0, "e": "Kecederaan berlaku secara tiba-tiba ketika pendaratan."}, {"q": "Seorang pelari mengalami sakit pada bahagian tulang kering selepas berlatih larian berulang kali selama beberapa minggu. Situasi ini menunjukkan kecederaan", "o": ["kronik", "akut", "luka tusukan", "kontusi akibat satu hentakan"], "a": 0, "e": "Kesakitan yang berkembang akibat aktiviti berulang dalam tempoh tertentu menunjukkan kecederaan kronik."}, {"q": "Antara berikut, yang manakah BUKAN contoh kecederaan kronik?", "o": ["Sprain lutut akibat satu pendaratan yang salah", "Tennis elbow", "Shin splints", "Stress fracture akibat tekanan berulang"], "a": 0, "e": "Sprain akibat satu kejadian secara tiba-tiba ialah kecederaan akut."}, {"q": "Apakah maksud kecederaan tisu lembut?", "o": ["Kecederaan yang melibatkan otot, tendon atau ligamen", "Kecederaan yang hanya melibatkan tulang", "Kecederaan yang melibatkan organ pencernaan sahaja", "Kecederaan yang hanya melibatkan kulit kepala"], "a": 0, "e": "Tisu lembut termasuk struktur seperti otot, tendon dan ligamen."}, {"q": "Apakah maksud kecederaan tisu keras?", "o": ["Kecederaan yang melibatkan tulang atau struktur keras", "Kecederaan yang hanya melibatkan otot", "Kecederaan yang hanya melibatkan kulit", "Kecederaan yang berpunca daripada kehilangan elektrolit"], "a": 0, "e": "Kecederaan tisu keras melibatkan struktur seperti tulang."}, {"q": "Patah tulang merupakan contoh kecederaan", "o": ["tisu keras", "tisu lembut", "stres haba", "kekejangan otot"], "a": 0, "e": "Patah melibatkan kerosakan pada tulang, iaitu tisu keras."}, {"q": "Strain merujuk kepada kecederaan yang melibatkan", "o": ["otot atau tendon", "tulang sahaja", "sendi terkeluar daripada kedudukan", "kulit yang terkena haba"], "a": 0, "e": "Strain ialah kecederaan pada otot atau tendon."}, {"q": "Sprain merujuk kepada kecederaan yang melibatkan", "o": ["ligamen", "tulang tengkorak", "kulit", "salur pernafasan"], "a": 0, "e": "Sprain ialah kecederaan pada ligamen, lazimnya apabila sendi terpiuh atau diregang berlebihan."}, {"q": "Apakah yang dimaksudkan dengan dislokasi?", "o": ["Tulang pada sendi terkeluar daripada kedudukan normal", "Otot mengecut secara tidak terkawal", "Kulit mengalami luka potongan", "Tendon mengalami keradangan akibat penggunaan berulang"], "a": 0, "e": "Dislokasi berlaku apabila tulang pada sendi teralih daripada kedudukan normal."}, {"q": "Kontusi biasanya berlaku akibat", "o": ["hentakan atau perlanggaran pada tisu", "penggunaan sendi berulang tanpa rehat sahaja", "kehilangan elektrolit melalui peluh", "pendedahan kepada cahaya matahari"], "a": 0, "e": "Kontusi ialah kecederaan tisu akibat hentakan atau perlanggaran."}, {"q": "Konkusi boleh dikaitkan dengan tanda seperti", "o": ["hilang ingatan, loya dan hilang imbangan seketika", "kulit kemerahan dan tidak berpeluh", "kekejangan otot dan kehilangan elektrolit sahaja", "sakit pada tendon akibat latihan berulang"], "a": 0, "e": "Tanda yang disenaraikan dalam bahan termasuk hilang ingatan, loya dan gangguan imbangan seketika."}, {"q": "Antara berikut, yang manakah bukan jenis luka?", "o": ["Hentakan", "Potongan", "Tusukan", "Cakaran"], "a": 0, "e": "Potongan, tusukan dan cakaran ialah jenis luka; hentakan bukan jenis luka."}, {"q": "Kekejangan otot boleh dikaitkan dengan", "o": ["dehidrasi dan kehilangan elektrolit", "patah tulang dan dislokasi", "luka potongan dan luka tusukan", "hilang ingatan dan loya"], "a": 0, "e": "Bahan rujukan mengaitkan kekejangan otot dengan dehidrasi dan kehilangan elektrolit."}, {"q": "Maklumat berikut: kadar nadi laju, suhu badan melebihi 39°C, kulit kemerahan dan kering serta tidak berpeluh. Apakah kecederaan yang paling tepat?", "o": ["Strok haba", "Ruam haba", "Keletihan haba", "Kekejangan haba"], "a": 0, "e": "Gabungan suhu badan sangat tinggi, kulit kering dan tidak berpeluh merupakan simptom strok haba dalam bahan rujukan."}, {"q": "Kecederaan akibat stres haba boleh dikaitkan dengan", "o": ["pendedahan kepada suhu tinggi dan dehidrasi", "hentakan pada tulang sahaja", "luka tusukan pada kulit", "penggunaan tendon secara berulang sahaja"], "a": 0, "e": "Bahan rujukan mengaitkan stres haba dengan pendedahan suhu tinggi dan dehidrasi."}, {"q": "Apakah tindakan yang sesuai untuk mengurangkan risiko kecederaan akibat haba semasa aktiviti sukan?", "o": ["Mengaklimasi diri terhadap haba secara beransur-ansur", "Mengabaikan sela rehat", "Melakukan aktiviti berterusan tanpa minum", "Memakai pakaian yang memerangkap haba"], "a": 0, "e": "Aklimasi terhadap haba secara beransur-ansur disenaraikan sebagai langkah pencegahan."}, {"q": "Antara berikut, yang manakah langkah pencegahan berkaitan aktiviti dalam cuaca panas?", "o": ["Peka kepada cuaca panas dan kelembapan", "Mengelakkan semua sela rehat", "Mengabaikan tanda awal dehidrasi", "Meningkatkan intensiti secara mendadak"], "a": 0, "e": "Kepekaan terhadap cuaca panas dan kelembapan membantu mengurangkan risiko stres haba."}, {"q": "Pilih kombinasi yang berkaitan dengan kecederaan akut.\nI. Berlaku secara tiba-tiba\nII. Disebabkan aktiviti berulang dalam tempoh panjang\nIII. Boleh disebabkan hentakan kuat pada tisu lembut\nIV. Berkembang secara perlahan-lahan", "o": ["I dan III", "I dan II", "II dan IV", "III dan IV"], "a": 0, "e": "Kecederaan akut berlaku secara tiba-tiba dan boleh disebabkan hentakan kuat pada tisu lembut."}, {"q": "Pilih kombinasi contoh kecederaan kronik.\nI. Tennis elbow\nII. Shin splints\nIII. Sprain akibat pendaratan tiba-tiba\nIV. Luka potongan akibat terkena objek tajam", "o": ["I dan II", "I dan III", "II dan IV", "III dan IV"], "a": 0, "e": "Tennis elbow dan shin splints merupakan contoh kecederaan kronik."}, {"q": "Pilih pernyataan yang benar tentang kecederaan tisu.\nI. Strain melibatkan otot atau tendon\nII. Sprain melibatkan ligamen\nIII. Patah tulang ialah kecederaan tisu keras\nIV. Dislokasi ialah luka pada kulit", "o": ["I, II dan III", "I dan II sahaja", "II dan IV sahaja", "I, III dan IV"], "a": 0, "e": "I, II dan III adalah benar. Dislokasi melibatkan tulang pada sendi yang terkeluar daripada kedudukan normal."}, {"q": "Pilih kombinasi simptom strok haba yang tepat.\nI. Kadar nadi laju\nII. Suhu badan melebihi 39°C\nIII. Kulit kemerahan dan kering\nIV. Tidak berpeluh", "o": ["I, II, III dan IV", "I dan II sahaja", "II dan III sahaja", "I, III dan IV sahaja"], "a": 0, "e": "Keempat-empat simptom tersebut disenaraikan dalam bahan rujukan sebagai simptom strok haba."}, {"q": "Seorang pemain mengalami sakit pada siku selepas melakukan pergerakan yang sama berulang kali dalam latihan selama beberapa minggu. Kecederaan yang paling sesuai ialah", "o": ["Tennis elbow", "Dislokasi", "Kontusi", "Konkusi"], "a": 0, "e": "Tennis elbow ialah contoh kecederaan kronik yang berkaitan tekanan atau penggunaan berulang."}, {"q": "Pemain bola sepak terjatuh selepas perlanggaran dan mengalami lebam pada paha. Kecederaan yang paling sesuai ialah", "o": ["Kontusi", "Konkusi", "Dislokasi", "Strok haba"], "a": 0, "e": "Lebam akibat hentakan atau perlanggaran pada tisu sesuai dikaitkan dengan kontusi."}, {"q": "Apakah pernyataan yang paling tepat tentang kecederaan akut dan kronik?", "o": ["Kedua-duanya boleh berlaku dalam sukan tetapi berbeza dari segi cara dan tempoh kejadian", "Kecederaan akut hanya berlaku kepada atlet profesional", "Kecederaan kronik sentiasa berlaku akibat satu hentakan", "Kecederaan akut tidak memerlukan perhatian"], "a": 0, "e": "Kedua-dua kategori boleh berlaku dalam aktiviti sukan; perbezaannya ialah kecederaan akut berlaku tiba-tiba manakala kronik berkembang beransur-ansur."}];let index=0,answers=Array(questions.length).fill(null),locked=false;
const quiz=document.getElementById('quiz'),result=document.getElementById('result');
function render(){const q=questions[index];locked=answers[index]!==null;document.getElementById('counter').textContent=`Soalan ${index+1} daripada ${questions.length}`;document.getElementById('progressText').textContent=`${Math.round(index/questions.length*100)}% selesai`;document.getElementById('progress').style.width=`${index/questions.length*100}%`;
quiz.innerHTML=`<section class="question"><div class="small">SOALAN ${index+1}</div><h2>${q.q.replace(/\n/g,'<br>')}</h2><div>${q.o.map((v,i)=>`<label class="option" id="opt${i}"><input type="radio" name="answer" value="${i}" ${locked&&answers[index]===i?'checked':''} ${locked?'disabled':''}><b>${'ABCD'[i]}.</b> ${v}</label>`).join('')}</div><div id="feedback" class="feedback"></div><div><button id="check" ${locked?'disabled':''} onclick="checkAnswer()">Semak jawapan</button><button class="secondary" id="next" ${locked?'':'disabled'} onclick="nextQuestion()">${index===questions.length-1?'Lihat keputusan':'Soalan seterusnya'}</button></div></section>`;if(locked)showFeedback();}
function checkAnswer(){const s=document.querySelector('input[name="answer"]:checked');if(!s){alert('Sila pilih satu jawapan.');return;}answers[index]=Number(s.value);locked=true;document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);document.getElementById('check').disabled=true;document.getElementById('next').disabled=false;showFeedback();}
function showFeedback(){const q=questions[index],a=answers[index];q.o.forEach((_,i)=>{const el=document.getElementById('opt'+i);if(i===q.a)el.classList.add('correct');if(i===a&&a!==q.a)el.classList.add('wrong')});const f=document.getElementById('feedback');f.className='feedback show '+(a===q.a?'good':'bad');f.innerHTML=`<b>${a===q.a?'Betul!':'Belum tepat.'}</b><br>Jawapan: <b>${'ABCD'[q.a]}. ${q.o[q.a]}</b><br>${q.e}`;}
function nextQuestion(){if(index<questions.length-1){index++;render();window.scrollTo(0,0)}else showResult();}
function showResult(){const score=answers.filter((a,i)=>a===questions[i].a).length,pct=Math.round(score/questions.length*100),grade=pct>=80?'Cemerlang':pct>=50?'Sederhana':'Perlu Usaha Lagi';quiz.classList.add('hidden');result.classList.remove('hidden');document.getElementById('progress').style.width='100%';document.getElementById('progressText').textContent='100% selesai';result.innerHTML=`<h2>Keputusan Kuiz</h2><div class="score">${score}/${questions.length}</div><p><b>${pct}% — ${grade}</b></p><p>${grade==='Cemerlang'?'Tahniah! Penguasaan anda sangat baik.':grade==='Sederhana'?'Baik. Teruskan ulang kaji untuk meningkatkan penguasaan.':'Teruskan usaha dan ulang kaji semula topik ini.'}</p><button onclick="review()">Semak jawapan</button><button class="secondary" onclick="restart()">Cuba semula</button><div id="review" class="hidden"></div>`;}
function review(){const box=document.getElementById('review');box.classList.toggle('hidden');box.innerHTML='<h2>Semakan Jawapan</h2>'+questions.map((q,i)=>`<div class="review-item"><b>${i+1}. ${q.q.replace(/\n/g,' ')}</b><br>Jawapan anda: ${answers[i]===null?'Tiada jawapan':'ABCD'[answers[i]]}<br>Jawapan betul: <b>${'ABCD'[q.a]}. ${q.o[q.a]}</b><br><span class="small">${q.e}</span></div>`).join('');}
function restart(){index=0;answers=Array(questions.length).fill(null);quiz.classList.remove('hidden');result.classList.add('hidden');render();window.scrollTo(0,0);}render();
</script></body></html>
